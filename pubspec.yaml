name: sri_fin_astra
description: Sri Fin Astra — Chartered Accountants.s Static Flutter web site.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  go_router: ^14.6.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/branding/
    - assets/images/hero/
    - assets/images/services/
    - assets/images/general/
    - assets/icons/